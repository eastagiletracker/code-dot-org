# Common workflow for execution of continuous integration for the `frontend` code base.
# Each job runs one turbo task; a package takes part once its package.json defines the script.
name: Frontend-CI

on:
  pull_request:
    branches:
      - staging
      - staging-next
    paths:
      - "frontend/**"
      - ".github/**"
  push:
    branches:
      - staging
      - staging-next
    paths:
      - "frontend/**"
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # actions/checkout fetches depth 2, so HEAD^1 is the pull request's base for `--affected`.
  TURBO_SCM_BASE: HEAD^1
  # One task per core; each vitest task brings its own worker pool.
  TURBO_CONCURRENCY: 100%
  APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-dryrun:
    name: release:dryrun
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            shared/fonts
            .github
          lfs: true
          fetch-depth: 2

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Build, Lint, Typecheck, Test
        run: yarn turbo run release:dryrun $AFFECTED
        working-directory: ./frontend

  test-ui:
    name: test:ui
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Each suite already fills the runner with its own workers.
      TURBO_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            shared/fonts
            .github
          lfs: true
          fetch-depth: 2

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: UI Tests
        # VISUAL_PROVIDER=applitools adds the @visual projects.
        run: yarn turbo run test:ui $AFFECTED
        working-directory: ./frontend
        env:
          VISUAL_PROVIDER: applitools
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          # Pull requests only report Eyes diffs; the post-merge push fails on them.
          APPLITOOLS_SHOULD_REPORT_FAILURE: ${{ github.event_name != 'pull_request' }}
          APPLITOOLS_BRANCH: ${{ github.head_ref }}

      - name: Upload Playwright Report
        # Upload on flakes too (passing-on-retry leaves the job green).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/**/playwright-report/
            frontend/**/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy
    if: ${{ github.event_name == 'push' }}
    needs: release-dryrun
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            shared/fonts
            .github
          lfs: true

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Authenticate Git for Deploys
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Deploy
        run: yarn turbo run deploy
        working-directory: ./frontend

  # Common teardown actions that must occur after _all_ jobs have completed.
  teardown:
    needs: [release-dryrun, test-ui]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Close the eyes batch after all distributed eyes tests have completed
      - name: Update Applitools batch status
        run: |
          curl -X POST "https://eyesapi.applitools.com/api/externals/github/servers/github.com/commit/${{ env.APPLITOOLS_BATCH_ID }}/${{ github.run_id }}/complete?apiKey=${{ secrets.APPLITOOLS_API_KEY }}"
