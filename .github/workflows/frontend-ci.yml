# CI for the frontend workspace. Each job runs one turbo verb; a package is
# covered as soon as its package.json defines the script, and turbo skips the
# packages that do not. Pull requests run the packages they change and their
# dependents; pushes run everything, with turbo's cache skipping what is unchanged.
name: Frontend-CI

on:
  pull_request:
    branches:
      - staging
      - staging-next
    paths:
      - "frontend/**"
      - ".github/**"
  push:
    branches:
      - staging
      - staging-next
    paths:
      - "frontend/**"
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # actions/checkout fetches depth 2, so HEAD^1 is the PR's base for --affected.
  TURBO_SCM_BASE: HEAD^1
  APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-dryrun:
    name: release:dryrun
    runs-on: ubuntu-24.04
    container:
      # Storybook's vitest browser project needs Playwright's Chromium. The tag's
      # version must match the catalog pin in frontend/.yarnrc.yml; its variant
      # (noble/jammy) must match the runner's Ubuntu release.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Install LFS
        run: apt-get update && apt-get install -y git-lfs

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            shared/fonts
            .github
          lfs: true
          fetch-depth: 2

      - name: Trust the checkout
        # The container's root user is not the checkout's owner. System level,
        # because steps below run with a different HOME.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Build, lint, typecheck, test
        # Concurrency is the runner's core count: each vitest task brings its
        # own worker pool, and turbo's default of 10 tasks thrashes 4 cores
        # until tests hit their 5s timeout.
        run: yarn turbo run release:dryrun $AFFECTED --concurrency=4
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          HOME: /root

  plan:
    name: test:ui plan
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            .github
          fetch-depth: 2

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: List the packages that implement test:ui
        id: packages
        # Unscoped names, because artifact names cannot contain "/".
        run: |
          packages=$(yarn turbo run test:ui $AFFECTED --dry=json \
            | jq -c '[.tasks[] | select(.task == "test:ui" and .command != "<NONEXISTENT>") | .package | ltrimstr("@code-dot-org/")]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages"
        working-directory: ./frontend

  test-ui:
    name: test:ui ${{ matrix.package }}
    needs: plan
    if: ${{ needs.plan.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Install LFS
        run: apt-get update && apt-get install -y git-lfs

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            shared/fonts
            .github
          lfs: true

      - name: Trust the checkout
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: UI tests
        # The package's own suite: Playwright functional projects and, with
        # VISUAL_PROVIDER=applitools, its @visual projects against Eyes.
        # HOME=/root is Playwright's Firefox-in-container fix.
        run: yarn turbo run test:ui --filter=@code-dot-org/${{ matrix.package }}
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          HOME: /root
          VISUAL_PROVIDER: applitools
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          # On PRs an Eyes diff is reported to the dashboard but does not fail
          # the run; the post-merge push run on staging still fails hard on diffs.
          APPLITOOLS_SHOULD_REPORT_FAILURE: ${{ github.event_name != 'pull_request' }}
          APPLITOOLS_BRANCH: ${{ github.head_ref }}

      - name: Upload Playwright Report
        # Upload on flakes too (passing-on-retry leaves the job green).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.package }}
          path: |
            frontend/**/playwright-report/
            frontend/**/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: deploy
    if: ${{ github.event_name == 'push' }}
    needs: release-dryrun
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Install LFS
        # Keeps turbo hashes equal to release-dryrun's, so the builds are cache hits.
        run: sudo apt-get update && sudo apt-get install -y git-lfs

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            shared/fonts
            .github
          lfs: true

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Let package deploys push as the Actions bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Deploy
        run: yarn turbo run deploy
        working-directory: ./frontend

  teardown:
    needs: [release-dryrun, test-ui]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Close the Eyes batch after all distributed Eyes tests have completed.
      - name: Update Applitools batch status
        run: |
          curl -X POST "https://eyesapi.applitools.com/api/externals/github/servers/github.com/commit/${{ env.APPLITOOLS_BATCH_ID }}/${{ github.run_id }}/complete?apiKey=${{ secrets.APPLITOOLS_API_KEY }}"
